# Generated by the HeroDevs Automated Remediation Platform.
# Event-triggered scan: PR merged into master.
# This workflow does no work itself: its completed runs notify the HeroDevs
# platform (workflow_run webhook), which scans the triggering branch and
# opens pull requests against 'master' server-side.
name: HeroDevs ARP scan trigger (event)

on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ARP_BASE_BRANCH: master
  ARP_STRATEGY: co_pilot

jobs:
  notify-platform:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    steps:
      - name: Request a HeroDevs platform scan
        run: |
          echo "Scan requested. The HeroDevs Automated Remediation Platform picks this run up"
          echo "and scans the repository server-side — no work happens on this runner."